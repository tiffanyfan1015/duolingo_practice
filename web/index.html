<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173e35"><title>詞間 · 我的語言練習室</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="./"><span class="brand-icon">詞</span><span>詞間<small>一點一滴，記住世界。</small></span></a><div class="side-label">我的學習空間</div><button class="side-active" id="home">▦ &nbsp; 單字練習室</button><div class="side-note"><span>YOUR OWN PACE</span><p>學過的字，<br>慢慢變成你的話。</p><div class="leaf">✳</div></div><button id="backup" class="side-action">↓ &nbsp; 備份複習紀錄</button><label class="side-action restore">↑ &nbsp; 匯入複習紀錄<input id="restore" type="file" accept="application/json" hidden></label><p class="storage-note">紀錄儲存在此瀏覽器<br>換裝置時可備份再匯入</p></aside>
<main>
<header><div class="breadcrumb">我的字庫 <span>/</span> Duolingo 學習筆記</div><a id="account-link" href="/account" hidden>帳號與 Duolingo</a><span class="local-badge">● 個人練習室</span></header>
<section class="intro"><div><div class="eyebrow">A LITTLE PRACTICE, EVERY DAY</div><h1>讓學過的字，留下來。</h1><p>從一個單元開始，找回熟悉的聲音與意思。</p></div><div class="language-switch" role="group" aria-label="學習語言"><button data-lang="de" class="selected">DE <span>德文</span></button><button data-lang="ja">JA <span>日文</span></button></div></section>
<section class="stats" aria-label="學習概況"><div><span>我的單字</span><strong id="total">—</strong></div><div><span>今天待複習</span><strong id="due">—</strong></div><div><span>已開始練習</span><strong id="learned">—</strong></div><div class="stat-illustration"><span class="big-glyph">Aa</span><small>KEEP YOUR WORDS CLOSE</small></div></section>
<section id="sync-area" aria-label="同步單字"></section>
<section class="workspace">
<div class="workspace-heading"><div><h2>單字練習室</h2><p id="course-meta">正在載入你的字庫…</p></div><label class="toggle"><input id="romaji" type="checkbox">顯示羅馬拼音</label></div>
<nav class="modes" aria-label="練習方式"><button data-mode="list" class="active">▦ &nbsp; 單字表</button><button data-mode="review">↻ &nbsp; 每日複習</button><button data-mode="flash">▱ &nbsp; 翻卡</button><button data-mode="spell">⌨ &nbsp; 拼字</button><button data-mode="listen">♫ &nbsp; 聽力</button></nav>
<div class="toolbar"><label class="unit-picker"><span>學習單元</span><select id="unit" aria-label="學習單元"><option value="all">全部單元</option></select></label><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋單字或中文意思" aria-label="搜尋單字或中文意思"></label><select id="filter" aria-label="單字狀態"><option value="all">全部單字</option><option value="due">待複習</option><option value="new">尚未練習</option><option value="star">已收藏</option></select></div>
<div class="list-tools"><span id="result-count"></span><div id="list-options"><select id="page-size" aria-label="每頁顯示數量"><option value="30">每頁 30 個</option><option value="0">全部展開</option></select><label><input id="hide-meaning" type="checkbox">遮住中文</label></div><div id="practice-options" hidden><label>這次練習 <select id="limit"><option value="10">10 個字</option><option value="20">20 個字</option><option value="0">全部</option></select></label></div></div>
<div id="content" aria-live="polite"><p class="empty">正在準備字庫…</p></div>
</section>
<footer><span>詞間 · 把一點練習，放進每一天。</span><button id="about">資料與學習提示 ↗</button></footer>
</main>
<dialog id="detail"><button class="close" aria-label="關閉">×</button><div id="detail-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script>
</body></html>
